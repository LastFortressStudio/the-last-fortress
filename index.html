<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#14251d"><title>The Last Fortress 0.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b16;color:#f8e7c2;font-family:system-ui,-apple-system,sans-serif}header{background:#203629;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:16px;margin:0}.sub{font-size:10px;color:#c9b78d}#stats{text-align:right;font-size:12px;line-height:1.5}#wrap{position:relative;width:min(100vw,460px);margin:auto}canvas{display:block;width:100%;height:auto;touch-action:none;background:#718953}#toast{min-height:36px;padding:6px 10px;font-size:12px;background:#21342a;line-height:1.35}#panel{max-width:460px;margin:auto;padding:8px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{border:1px solid #8a7b53;border-radius:7px;background:#344b3a;color:#fff2d3;font-weight:650;padding:9px 2px;font-size:11px;touch-action:manipulation}button.on{background:#b48b42;color:#1d2117}button:disabled{opacity:.45}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:7px}.actions button{font-size:12px;background:#75502b}#go{background:#a67832;font-size:13px}.note{font-size:11px;color:#c2b394;margin:7px 0 0}#detail{font-size:11px;color:#e8d8b4;margin:7px 0;min-height:17px}</style></head><body><header><div><h1>🏰 THE LAST FORTRESS</h1><div class="sub">PROTOTYP 0.3 · FYRA FRONTER</div></div><div id="stats"></div></header><div id="wrap"><canvas id="game" width="420" height="546"></canvas><div id="toast"></div></div><div id="panel"><div class="tools" id="tools"></div><div id="detail"></div><div class="actions"><button id="go">⚔️ STARTA</button><button id="pause">⏸️ PAUS</button><button id="upgrade">⬆️ UPPGRADERA</button></div><div class="note">Tryck på en byggnad för att markera den. Flytta med 🔀 mellan slagen. Under strid kan du bygga medan fienden anfaller. Pausa för att uppgradera, inte bygga.</div></div><script>
'use strict';
const C=document.getElementById('game'),g=C.getContext('2d'),stats=document.getElementById('stats'),tools=document.getElementById('tools'),toast=document.getElementById('toast'),detail=document.getElementById('detail'),go=document.getElementById('go'),pauseBtn=document.getElementById('pause'),upBtn=document.getElementById('upgrade');
const N=14,S=30,OY=62,city={x:5,y:6,w:4,h:3};
const defs={wall:{label:'🪵 Mur',cost:45,hp:125},moat:{label:'💧 Vallgrav',cost:60,hp:9999},archer:{label:'🏹 Skytt',cost:95,hp:65},tower:{label:'🗼 Torn',cost:165,hp:190},farm:{label:'🌾 Gård',cost:120,hp:100},mine:{label:'⛏️ Gruva',cost:180,hp:120}};
const icons={wall:'🪵',moat:'💧',archer:'🏹',tower:'🗼',farm:'🌾',mine:'⛏️'};
const k=(x,y)=>x+','+y, inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N, core=(x,y)=>x>=city.x&&x<city.x+city.w&&y>=city.y&&y<city.y+city.h;
const saveKey='lastFortressV03';let s;function fresh(){return {level:1,gold:310,build:{},wins:0}};
try{s=JSON.parse(localStorage.getItem(saveKey))}catch(e){};
let migrated=false;if(!s){s=fresh();try{const old=JSON.parse(localStorage.getItem('lastFortressV01'));if(old){s.level=Math.max(1,old.level||1);s.gold=Math.max(310,old.gold||0);s.wins=old.wins||0;let refund=0;for(const v of Object.values(old.build||{}))refund+=Math.floor((defs[v]?.cost||0)*.75);s.gold+=refund;migrated=true}}catch(e){}}
const save=()=>{try{localStorage.setItem(saveKey,JSON.stringify(s))}catch(e){}};
let selected='wall',focus=null,moveFrom=null,active=false,paused=false,phase=0,wave=0,waveCount=0,spawned=0,spawnClock=0,tick=0,cityHP=100,enemies=[],fx=[],nextTimer=0,loopId=null;
function say(t){toast.textContent=t}function building(x,y){return s.build[k(x,y)]}function count(type){return Object.values(s.build).filter(b=>b.type===type).length}
function enemyCount(l){return Math.min(4+Math.floor(l*.55),20)}function totalWaves(){return Math.min(2+Math.floor(s.level/4),5)}
function terrain(x,y){if(core(x,y))return 'city';if(y<=2&&x>=2&&x<=11)return 'forest';if(x<=2&&y>=3&&y<=11)return 'mountain';if(y>=11&&x>=3&&x<=10)return 'water';return 'field'}
function canBuild(x,y){return inside(x,y)&&!core(x,y)&&terrain(x,y)!=='water'&&terrain(x,y)!=='mountain'&&!(x===0||x===N-1||y===0||y===N-1)}
function buildHP(b){return defs[b.type].hp*(1+(b.lv-1)*.6)}function upgradeCost(b){return Math.round(defs[b.type].cost*(.65+b.lv*.35))}
function ui(){stats.innerHTML=`Nivå <b>${s.level}</b> · 💰 <b>${s.gold}</b><br>🏘️ <b>${Math.max(0,Math.ceil(cityHP))}%</b> · ${active?'Våg '+wave+'/'+totalWaves():'Förberedelse'}`;tools.innerHTML='';for(const [id,d] of Object.entries(defs)){const b=document.createElement('button');b.textContent=d.label+' '+d.cost;b.className=selected===id?'on':'';b.onclick=()=>{selected=id;moveFrom=null;focus=null;ui()};tools.appendChild(b)}const b=document.createElement('button');b.textContent='🔀 Flytta';b.className=selected==='move'?'on':'';b.disabled=active;b.onclick=()=>{selected='move';focus=null;moveFrom=null;say('Välj en byggnad och sedan en ledig ruta.');ui()};tools.appendChild(b);const sell=document.createElement('button');sell.textContent='💰 Sälj';sell.className=selected==='sell'?'on':'';sell.disabled=active;sell.onclick=()=>{selected='sell';moveFrom=null;ui()};tools.appendChild(sell);go.disabled=active;go.textContent=active?'⚔️ STRID PÅGÅR':'⚔️ STARTA';pauseBtn.disabled=!active;pauseBtn.textContent=paused?'▶️ FORTSÄTT':'⏸️ PAUS';upBtn.disabled=!focus||!s.build[focus]||(!active?false:!paused);let fb=s.build[focus];detail.textContent=fb?`${defs[fb.type].label} · nivå ${fb.lv} · liv ${Math.ceil(fb.hp)}/${Math.ceil(buildHP(fb))} · uppgradera ${upgradeCost(fb)} guld`:'Välj byggnad och tryck på kartan. Stadens hjärta ligger i mitten.'}
function tap(x,y){if(!inside(x,y))return;const key=k(x,y),b=s.build[key];if(paused&&active){if(b){focus=key;ui()}else say('Under paus kan du bara uppgradera.');return}
if(!active&&selected==='move'){if(!moveFrom){if(b){moveFrom=key;focus=key;say('Välj nu en ny ledig ruta.')}else say('Välj en byggnad att flytta.')}else if(key===moveFrom){moveFrom=null;say('Flytt avbruten.')}else if(!b&&canBuild(x,y)){s.build[key]=s.build[moveFrom];delete s.build[moveFrom];focus=key;moveFrom=null;say('Byggnaden flyttad utan kostnad.');save()}else say('Här kan du inte flytta byggnaden.');ui();draw();return}
if(!active&&selected==='sell'){if(b){s.gold+=Math.floor(defs[b.type].cost*.5);delete s.build[key];focus=null;save();say('Såld för halva grundpriset.')}ui();draw();return}
if(b){focus=key;say(`${defs[b.type].label} nivå ${b.lv}. Uppgradera med knappen nedan.`);ui();draw();return}
if(!canBuild(x,y)){say('Här går det inte att bygga. Vatten och berg är naturliga hinder.');return}if(!defs[selected])return;if(s.gold<defs[selected].cost){say('Inte tillräckligt med guld!');return}if(enemies.some(e=>Math.hypot(e.x-x,e.y-y)<.75)){say('Fienden står i vägen!');return}s.gold-=defs[selected].cost;s.build[key]={type:selected,lv:1,hp:defs[selected].hp};focus=key;save();say('Byggt '+defs[selected].label+(active?' mitt under striden!':''));ui();draw()}
C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*420/r.width/S),y=Math.floor(((e.clientY-r.top)*546/r.height-OY)/S);tap(x,y)});
function upgrade(){const b=s.build[focus];if(!b)return;if(active&&!paused){say('Pausa först för att uppgradera under strid.');return}const cost=upgradeCost(b);if(s.gold<cost){say('Du behöver '+cost+' guld.');return}if(b.lv>=5){say('Maxnivå 5 i prototypen.');return}s.gold-=cost;b.lv++;b.hp=buildHP(b);save();say('Uppgraderad till nivå '+b.lv+'!');ui();draw()}
upBtn.onclick=upgrade;pauseBtn.onclick=()=>{if(!active)return;paused=!paused;say(paused?'⏸️ Paus. Uppgradera försvar – ingen nybyggnation.':'▶️ Striden fortsätter!');ui()};go.onclick=()=>{if(active)return;active=true;paused=false;wave=0;cityHP=100;enemies=[];fx=[];tick=0;nextTimer=15;startNextWave();say('⚔️ Fienden kommer! Guld för varje besegrad fiende.');ui();if(loopId)clearInterval(loopId);loopId=setInterval(step,90)};
function directions(){if(s.level<4)return ['E'];if(s.level<8)return ['E','N'];if(s.level<15)return ['E','N','W'];return ['E','N','W','S']}
function startNextWave(){wave++;spawned=0;waveCount=enemyCount(s.level)+wave*2;spawnClock=0;nextTimer=0;let dirs=directions();say(`⚔️ VÅG ${wave}/${totalWaves()}! ${dirs.map(d=>({E:'Öster',N:'Norr',W:'Väster',S:'Söder'})[d]).join(' / ')}`);ui()}
function spawn(){const dirs=directions(),dir=dirs[(spawned+wave)%dirs.length];let x,y;if(dir==='E'){x=13;y=3+Math.floor(Math.random()*8)}else if(dir==='W'){x=0;y=3+Math.floor(Math.random()*8)}else if(dir==='N'){x=3+Math.floor(Math.random()*8);y=0}else{x=3+Math.floor(Math.random()*8);y=13}let type='raider';if(s.level>=3&&spawned%6===0)type='shield';if(s.level>=6&&spawned%9===0)type='ram';if(s.level>=15&&spawned%12===0)type='horse';if(s.level>=100&&wave===totalWaves()&&spawned%9===0)type='elephant';let hp={raider:54,shield:120,ram:250,horse:90,elephant:650}[type]*(1+Math.min(s.level-1,120)*.085);enemies.push({x,y,type,hp,max:hp,speed:{raider:.26,shield:.17,ram:.13,horse:.38,elephant:.12}[type],damage:{raider:9,shield:12,ram:35,horse:14,elephant:55}[type],reward:{raider:13,shield:24,ram:55,horse:22,elephant:160}[type],cool:0,move:0,dir})}
function walkable(x,y){return inside(x,y)&&terrain(x,y)!=='mountain'&&terrain(x,y)!=='water'}
function nextStep(e){const tx=6.5,ty=7;let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:Math.round(e.x)+dx,y:Math.round(e.y)+dy})).filter(p=>walkable(p.x,p.y));opts.sort((a,b)=>{function cost(p){let z=Math.hypot(p.x-tx,p.y-ty),ob=building(p.x,p.y);return z+(ob&&(ob.type==='wall'||ob.type==='tower')?2.4:0)+(ob&&ob.type==='moat'?1.2:0)}return cost(a)-cost(b)});return opts[0]}
function step(){if(!active||paused)return;tick++;if(spawned<waveCount&&tick%9===0){spawn();spawned++}if(tick%7===0){for(const [pos,b] of Object.entries(s.build)){if(b.type!=='archer'&&b.type!=='tower')continue;const [x,y]=pos.split(',').map(Number),range=(b.type==='tower'?4.8:3.3)+b.lv*.35;let target=enemies.filter(e=>e.hp>0&&Math.hypot(e.x-x,e.y-y)<=range).sort((a,c)=>Math.hypot(a.x-6.5,a.y-7)-Math.hypot(c.x-6.5,c.y-7))[0];if(target){target.hp-=(b.type==='tower'?19:12)*(1+(b.lv-1)*.4);fx.push({x:target.x,y:target.y,t:5})}}}
for(const e of enemies){if(e.hp<=0)continue;e.cool=Math.max(0,e.cool-1);if(core(Math.round(e.x),Math.round(e.y))){cityHP-=e.damage*.12;e.hp=0;continue}e.move+=e.speed;const next=nextStep(e);if(!next)continue;let ob=s.build[k(next.x,next.y)];if(ob&&['wall','tower','archer','farm','mine'].includes(ob.type)){if(e.cool===0){ob.hp-=e.damage*(e.type==='ram'?1.6:1);e.cool=9;if(ob.hp<=0){delete s.build[k(next.x,next.y)];if(focus===k(next.x,next.y))focus=null;say('💥 En byggnad har förstörts!')}}continue}let slow=ob&&ob.type==='moat'?.22:1;if(e.move>=1/slow){e.x=next.x;e.y=next.y;e.move=0}}
for(const e of enemies)if(e.hp<=0&&e.hp> -999){if(!core(Math.round(e.x),Math.round(e.y))){s.gold+=e.reward;fx.push({x:e.x,y:e.y,t:7,coin:e.reward})}e.hp=-1000}
enemies=enemies.filter(e=>e.hp>0);fx.forEach(f=>f.t--);fx=fx.filter(f=>f.t>0);if(cityHP<=0){finish(false);return}if(spawned>=waveCount&&enemies.length===0){if(wave>=totalWaves()){finish(true);return}if(nextTimer===0){nextTimer=35;say(`✅ Våg ${wave} avklarad! Nästa våg kommer snart. Bygg och förstärk!`)}else if(--nextTimer===0)startNextWave()}if(tick%5===0)ui();draw()}
function finish(win){clearInterval(loopId);loopId=null;active=false;paused=false;const income=count('mine')*35+count('farm')*15;if(win){const prize=65+s.level*22+income;s.gold+=prize;s.wins++;s.level++;say(`🏆 SEGER! +${prize} guld i nivåbonus och produktion. Nivå ${s.level} väntar!`)}else{s.gold+=35+income;say(`💥 STADEN FÖLL! Du behåller dina kvarvarande byggnader och får ${35+income} guld. Försök igen.`)}save();ui();draw()}
function draw(){g.clearRect(0,0,420,546);g.fillStyle='#152a22';g.fillRect(0,0,420,546);g.fillStyle='#e7d2a2';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('🌲 NORR · SKOG',210,20);g.fillText('⛰️ VÄSTER',69,41);g.fillText('ÖSTER · FÄLT 🌾',330,41);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=terrain(x,y),px=x*S,py=y*S+OY;g.fillStyle=t==='forest'?((x+y)%2?'#355e38':'#406b40'):t==='mountain'?'#77776a':t==='water'?((x+y)%2?'#367ca0':'#4188ab'):t==='city'?'#b4a17a':((x+y)%2?'#8ca96a':'#86a265');g.fillRect(px,py,S,S);g.strokeStyle='#ffffff13';g.strokeRect(px,py,S,S);if(t==='forest'&&(x*7+y*11)%3===0){g.font='17px serif';g.fillText('🌲',px+15,py+23)}if(t==='mountain'&&(x*3+y)%2===0){g.font='18px serif';g.fillText('⛰️',px+15,py+23)}if(t==='water'&&(x+y)%3===0){g.fillStyle='#b2e4e9';g.font='13px serif';g.fillText('〰',px+15,py+20)}}
g.fillStyle='#e0c68d';g.fillRect(city.x*S+3,city.y*S+OY+3,city.w*S-6,city.h*S-6);g.fillStyle='#715743';g.fillRect(6*S,7*S+OY,58,43);g.font='26px serif';g.fillText('🏰',210,OY+7*S+12);g.font='bold 11px system-ui';g.fillStyle='#2a251c';g.fillText('DIN STAD',210,OY+8*S+20);g.fillStyle='#6b2b24';g.fillRect(165,OY+9*S-3,90,6);g.fillStyle='#78c66d';g.fillRect(165,OY+9*S-3,90*Math.max(0,cityHP)/100,6);
for(const [pos,b] of Object.entries(s.build)){const [x,y]=pos.split(',').map(Number),px=x*S,py=y*S+OY;if(focus===pos||moveFrom===pos){g.strokeStyle='#ffe38a';g.lineWidth=3;g.strokeRect(px+2,py+2,S-4,S-4);g.lineWidth=1}g.font='23px serif';g.fillText(icons[b.type],px+15,py+23);if(b.lv>1){g.font='bold 9px system-ui';g.fillStyle='#fff';g.fillText(''+b.lv,px+24,py+9)}if(b.hp<buildHP(b)&&b.type!=='moat'){g.fillStyle='#602d25';g.fillRect(px+3,py+26,24,3);g.fillStyle='#7fea70';g.fillRect(px+3,py+26,24*Math.max(0,b.hp)/buildHP(b),3)}}
for(const e of enemies){const px=e.x*S+15,py=e.y*S+OY+16;g.font=e.type==='elephant'?'27px serif':'23px serif';g.fillText(({raider:'⚔️',shield:'🛡️',ram:'🐏',horse:'🐎',elephant:'🐘'})[e.type],px,py+6);g.fillStyle='#682d27';g.fillRect(px-12,py+9,24,4);g.fillStyle='#91e177';g.fillRect(px-12,py+9,24*Math.max(0,e.hp)/e.max,4)}for(const f of fx){g.font='bold 12px system-ui';g.fillStyle=f.coin?'#ffde66':'#ffb477';g.fillText(f.coin?'+'+f.coin:'✦',f.x*S+15,f.y*S+OY+8-f.t)}g.fillStyle='#c9e4ec';g.font='bold 12px system-ui';g.fillText('🌊 SÖDER · HAV',210,536);if(active){g.fillStyle='#1b241edb';g.fillRect(100,24,220,28);g.fillStyle='#fff4d1';g.font='bold 13px system-ui';g.fillText(paused?'⏸️ PAUSAT':`⚔️ VÅG ${wave}/${totalWaves()} · ${enemies.length} FIENDER`,210,43)}}
if(migrated){say('🏰 Din gamla nivå och ditt guld har följt med! Gamla byggnader har ersatts med 75 % av värdet i guld så du kan bygga om för den nya kartan.')}else say('🏰 Ny karta! Staden i mitten. Bygg försvar, välj din strategi och starta första anfallet.');save();ui();draw();
</script></body></html>
