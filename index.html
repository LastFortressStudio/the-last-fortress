<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#192b25"><title>The Last Fortress</title><style>*{box-sizing:border-box}body{margin:0;background:#101b18;color:#f5e8c9;font-family:system-ui,-apple-system,sans-serif}header{padding:10px 12px;background:#21352b;display:flex;justify-content:space-between;align-items:center;gap:6px}h1{font-size:17px;margin:0}small{color:#d5c7a5}.stats{font-size:12px;text-align:right}#game{display:block;width:auto;max-width:100%;height:min(52dvh,510px);margin:auto;touch-action:none;background:#608454}#panel{max-width:520px;margin:auto;padding:7px 9px}#message{min-height:24px;font-size:12px;line-height:1.35}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:1px solid #8d7a4f;border-radius:8px;padding:8px 3px;background:#314a39;color:#fff2d0;font-size:12px;font-weight:650}button.selected{background:#a07939;color:#fff}button:disabled{opacity:.35}#start{background:#93652e;width:100%;font-size:16px;margin-top:6px;padding:10px}.hint{font-size:11px;color:#c7b99c;margin:8px 0 0}</style></head><body><header><div><h1>🏰 THE LAST FORTRESS</h1><small>Prototyp 0.2 · Välj byggnad nedan</small></div><div class="stats" id="stats"></div></header><canvas id="game" width="390" height="510"></canvas><div id="panel"><div id="message"></div><div class="buttons" id="buttons"></div><button id="start">⚔️ STARTA ANFALL</button><p class="hint">Tryck på en byggnadstyp och sedan på en ruta. Tryck på en byggnad med samma verktyg för att sälja den för halva priset. Staden sparas i webbläsaren om lagring tillåts.</p></div><script>
const C=document.getElementById('game'),ctx=C.getContext('2d'),msg=document.getElementById('message'),stats=document.getElementById('stats'),btns=document.getElementById('buttons'),start=document.getElementById('start');
const W=13,H=17,S=30;const items={wall:{name:'🪵 Plank',cost:45,hp:130},moat:{name:'💧 Vallgrav',cost:60,hp:9999},archer:{name:'🏹 Bågskytt',cost:75,hp:60},tower:{name:'🗼 Torn',cost:140,hp:190},farm:{name:'🌾 Gård',cost:120,hp:90},mine:{name:'⛏️ Gruva',cost:180,hp:100}};
let state;function fresh(){return {level:1,gold:310,build:{},wins:0}};try{state=JSON.parse(localStorage.getItem('lastFortressV01'))||fresh()}catch(e){state=fresh()}let selected='wall',running=false,enemies=[],shots=[],tick=0,spawned=0,cityHP=100,animation=0;
function save(){try{localStorage.setItem('lastFortressV01',JSON.stringify(state))}catch(e){}}function say(s){msg.textContent=s}function key(x,y){return x+','+y}function building(x,y){return state.build[key(x,y)]}function count(type){return Object.values(state.build).filter(x=>x===type).length}function ui(){stats.innerHTML=`Nivå <b>${state.level}</b> · 💰 <b>${state.gold}</b><br>🏘️ Stad: ${cityHP}%`;btns.innerHTML='';Object.entries(items).forEach(([id,b])=>{let el=document.createElement('button');el.className=id===selected?'selected':'';el.textContent=b.name+' · '+b.cost;el.disabled=running;el.onclick=()=>{selected=id;ui()};btns.appendChild(el)});start.disabled=running;start.textContent=running?'⚔️ ANFALLET PÅGÅR':'⚔️ STARTA ANFALL'}
function place(x,y){if(running||y<6||y>14)return;let k=key(x,y),old=state.build[k];if(old){if(old===selected){state.gold+=Math.floor(items[old].cost/2);delete state.build[k];say('Byggnaden såld. Halva guldet tillbaka.')}else{say('Rutan är upptagen. Välj samma byggnad för att sälja.')} }else if(state.gold<items[selected].cost){say('Du behöver mer guld!')}else{state.gold-=items[selected].cost;state.build[k]=selected;say('Byggt: '+items[selected].name)}save();ui();draw()}
C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*W/r.width),y=Math.floor((e.clientY-r.top)*H/r.height);place(x,y)});
function draw(){ctx.fillStyle='#78985d';ctx.fillRect(0,0,390,510);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=(x+y)%2?'#73965d':'#799b63';ctx.fillRect(x*S,y*S,S,S);ctx.strokeStyle='#ffffff15';ctx.strokeRect(x*S,y*S,S,S)}ctx.fillStyle='#c3b68a';ctx.fillRect(0,0,390,180);ctx.fillStyle='#a5a084';for(let i=0;i<24;i++){let x=(i*83+23)%390,y=(i*47+19)%175;ctx.fillRect(x,y,4,4)}ctx.fillStyle='#4e6a47';ctx.fillRect(0,450,390,60);ctx.fillStyle='#d1aa72';for(let x=1;x<13;x+=3){ctx.fillRect(x*S+4,465,44,30);ctx.fillStyle='#80523b';ctx.beginPath();ctx.moveTo(x*S,466);ctx.lineTo(x*S+26,448);ctx.lineTo(x*S+51,466);ctx.fill();ctx.fillStyle='#d1aa72'}ctx.fillStyle='#fff4d4';ctx.font='bold 12px system-ui';ctx.fillText('DIN STAD',160,502);for(let [k,type] of Object.entries(state.build)){let [x,y]=k.split(',').map(Number),cx=x*S+15,cy=y*S+19;ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(({wall:'🪵',moat:'💧',archer:'🏹',tower:'🗼',farm:'🌾',mine:'⛏️'})[type],cx,cy+5)}ctx.textAlign='center';for(let e of enemies){ctx.font='22px serif';ctx.fillText(e.kind==='heavy'?'🛡️':e.kind==='ram'?'🐏':'⚔️',e.x*S+15,e.y*S+18);ctx.fillStyle='#5c211d';ctx.fillRect(e.x*S+4,e.y*S+24,22,3);ctx.fillStyle='#82da76';ctx.fillRect(e.x*S+4,e.y*S+24,22*Math.max(0,e.hp/e.max),3)}for(let p of shots){ctx.fillStyle='#fce69b';ctx.beginPath();ctx.arc(p.x*S+15,p.y*S+15,3,0,7);ctx.fill()}if(running){ctx.fillStyle='#211b14aa';ctx.fillRect(0,0,390,30);ctx.fillStyle='white';ctx.font='bold 14px system-ui';ctx.fillText('ANFALL! Fiender kvar: '+(enemies.length+Math.max(0,total()-spawned)),195,20)}ctx.textAlign='start'}
function total(){return Math.min(5+state.level*2,65)}function startWave(){if(running)return;running=true;cityHP=100;enemies=[];shots=[];tick=0;spawned=0;say('Försvara staden! Dina bågskyttar och torn skjuter automatiskt.');ui();loop()}
function loop(){if(!running)return;tick++;if(tick%28===0&&spawned<total()){let n=spawned++,kind=state.level>=5&&n%8===0?'ram':state.level>=3&&n%4===0?'heavy':'soldier',hp=kind==='ram'?125:kind==='heavy'?75:38;enemies.push({x:Math.floor(Math.random()*W),y:0,hp,max:hp,kind,slow:0})}if(tick%15===0){for(let [k,type] of Object.entries(state.build)){if(!['archer','tower'].includes(type))continue;let [x,y]=k.split(',').map(Number),range=type==='tower'?7:5,target=enemies.filter(e=>Math.hypot(e.x-x,e.y-y)<range).sort((a,b)=>b.y-a.y)[0];if(target){target.hp-=type==='tower'?33:20;shots.push({x:target.x,y:target.y,life:7})}}}if(tick%21===0){for(let e of enemies){if(e.hp<=0)continue;let ahead=building(e.x,Math.ceil(e.y)+1);if(ahead==='moat'){e.slow++;if(e.slow%3!==0)continue}if(ahead==='wall'||ahead==='tower'){let k=key(e.x,Math.ceil(e.y)+1);e.slow++;if(e.slow%((e.kind==='ram')?2:5)!==0)continue;delete state.build[k];continue}e.y+=e.kind==='ram'?.65:e.kind==='heavy'?.75:1;if(e.y>=15){cityHP-=e.kind==='ram'?23:e.kind==='heavy'?13:8;e.hp=0}}}enemies=enemies.filter(e=>e.hp>0);shots=shots.filter(p=>--p.life>0);draw();if(cityHP<=0){finish(false);return}if(spawned>=total()&&enemies.length===0){finish(true);return}animation=setTimeout(loop,75)}
function finish(won){running=false;let income=count('farm')*20+count('mine')*38;if(won){let prize=100+state.level*25+income;state.gold+=prize;state.wins++;say(`🏆 SEGER! +${prize} guld (inklusive ${income} från gårdar/gruvor). Nivå ${state.level+1} väntar!`);state.level++}else{let compensation=35+income;state.gold+=compensation;say(`💥 Staden plundrades! Du behåller dina byggnader och får ${compensation} guld. Bygg om och försök igen.`)}save();ui();draw()}
start.onclick=startWave;say('Nivå 1: Bygg ditt första försvar. Du har redan två frivilliga bågskyttar i staden – placera gärna fler!'); // free starter archers only on brand new game
if(state.level===1&&state.wins===0&&Object.keys(state.build).length===0){state.build['4,13']='archer';state.build['8,13']='archer';save()}
ui();draw();
</script></body></html>
